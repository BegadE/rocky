<article class="post-row">
  <time class="post-date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %-d, %Y' }}</time>
  <div class="post-summary">
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncatewords: 24 }}</p>
  </div>
</article>
